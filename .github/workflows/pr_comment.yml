name: PR comment

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Docs]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'workflow run-id of the Docs workflow which generated the message'
        required: true

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  preview-url:
    name: Preview URL
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: comment-${{ github.sha }}
          path: pr
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(cat ./pr/number)
          repo=$(cat ./pr/repo)

          gh pr comment $number \
          --body-file ./pr/body.md \
          --repo $repo
